<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f24">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BraunyCode">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>BraunyCode</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="top">
  <button class="icon-btn" id="btn-history" type="button" aria-label="Verlauf">
    <span aria-hidden="true">☰</span>
  </button>
  <div class="brand">
    <strong>BraunyCode</strong>
    <span class="meta"><span id="health" class="dot"></span><span id="health-text">verbinde …</span></span>
  </div>
  <button class="icon-btn" id="btn-new" type="button" aria-label="Neuer Auftrag">
    <span aria-hidden="true">＋</span>
  </button>
</header>

<main class="stream" id="stream" aria-live="polite">
  <div class="welcome" id="empty">
    <div class="mark" aria-hidden="true">B</div>
    <h1>Was soll ich bauen?</h1>
    <p>Ich lese, schreibe und führe Code aus — und belege jede Änderung mit einem Lauf.</p>
    <div class="chips" id="chips"></div>
  </div>
</main>

<form class="composer" id="composer" autocomplete="off">
  <div class="field">
    <textarea id="prompt" rows="1" enterkeyhint="send"
              placeholder="Auftrag eingeben …"></textarea>
    <button class="send" id="btn-run" type="submit" aria-label="Auftrag starten">
      <span class="arrow" aria-hidden="true">↑</span>
      <span class="square" aria-hidden="true"></span>
    </button>
  </div>
  <p class="hint" id="hint">Läuft auf deinem Server · <span id="hint-model">—</span></p>
</form>

<div class="sheet" id="gate" hidden>
  <div class="box">
    <h2>Anmelden</h2>
    <p>Dein Zugangs-Token steht in <code>brauny.env</code> auf dem Server.</p>
    <input id="token" type="password" placeholder="Zugangs-Token"
           autocomplete="current-password" enterkeyhint="go">
    <button class="btn" id="btn-login" type="button">Speichern</button>
  </div>
</div>

<div class="sheet" id="history" hidden>
  <div class="box">
    <h2>Verlauf</h2>
    <ul class="hist" id="hist-list"></ul>
    <div class="row">
      <button class="btn ghost" id="btn-hist-clear" type="button">Löschen</button>
      <button class="btn" id="btn-hist-close" type="button">Schließen</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="/static/app.js"></script>
</body>
</html>
